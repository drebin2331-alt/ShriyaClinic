name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK File
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/ShriyaDentalClinic.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShriyaDentalClinic-APK
          path: release-apk/ShriyaDentalClinic.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: Shriya Dental Clinic Mobile App v1.0.0
          make_latest: true
          draft: false
          prerelease: false
          body: |
            ### 📱 Shriya Multispeciality Dental Clinic - Android Mobile App
            Official Android Mobile App APK build for patients & doctors.
            
            #### 📥 How to Install:
            1. Tap on **`ShriyaDentalClinic.apk`** below to download the APK directly to your phone.
            2. When the download finishes, open the file.
            3. Tap **Install** (if prompted by your phone or Chrome, allow *Install from unknown sources*).
            4. Open the app to access instant appointments, treatment records, and 3D dental odontogram!
          files: release-apk/ShriyaDentalClinic.apk
          token: ${{ secrets.GITHUB_TOKEN }}
